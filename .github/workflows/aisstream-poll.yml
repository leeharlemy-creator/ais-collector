name: AISstream poll to Supabase

on:
  schedule:
    # GitHub utilise UTC. Une exécution toutes les 20 minutes.
    - cron: "*/20 * * * *"
  workflow_dispatch:

concurrency:
  group: aisstream-poll
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect-ais:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Écouter AISstream 2 min 30 s et écrire dans Supabase
        env:
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/github-aisstream-poll.mjs
